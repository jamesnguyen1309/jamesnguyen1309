name: Generate profile images

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Stats and top-languages cards (replaces the public github-readme-stats server).
      # Add a STATS_TOKEN secret (a personal access token) to count private repos; the default token sees public data only.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate stats cards
        run: node scripts/stats-cards.mjs "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FF5F1F&color_dots=#1A1A1A,#5A2110,#8C3416,#CC4A1B,#FF5F1F

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
