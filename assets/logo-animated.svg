<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -110 910 910" width="400" height="400" role="img" aria-label="Animated orange shark logo">
<style>
.logo{width:1080px;height:auto;display:block}

.shark{transform-origin:355px 342px;animation:intro 1.1s cubic-bezier(.2,.8,.3,1) both}
.ring{transform-origin:355px 342px;opacity:0;animation:ring 1.1s ease-out both}
.bob{transform-origin:355px 342px;animation:bob 3.2s ease-in-out 1.1s infinite}
.lid{transform-origin:0 -34px;transform:scaleY(0);animation:blink 3.2s ease-in-out 1.7s infinite}
.x{transform-origin:0 0;animation:spark 3.2s cubic-bezier(.3,1.6,.5,1) 1.05s infinite}
@keyframes intro{0%{opacity:0;transform:translate(-220px,260px) rotate(-200deg) scale(.1)}40%{opacity:1}58%{transform:translate(14px,-16px) rotate(10deg) scale(1.22,1.16)}70%{transform:translate(0,6px) rotate(-6deg) scale(1.08,.86)}82%{transform:rotate(3deg) scale(.96,1.05)}92%{transform:rotate(-1deg) scale(1.01,.99)}100%{opacity:1;transform:none}}
@keyframes ring{0%,60%{opacity:0;transform:scale(1.03)}66%{opacity:.85;transform:scale(1.07)}100%{opacity:0;transform:scale(1.5)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(-1.6deg)}}
@keyframes blink{0%,84%,100%{transform:scaleY(0)}88%{transform:scaleY(1)}92%{transform:scaleY(0)}}
@keyframes spark{0%{transform:rotate(0) scale(1)}10%{transform:rotate(90deg) scale(1.45)}18%,100%{transform:rotate(90deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.shark,.ring,.bob,.lid,.x{animation:none}.ring{opacity:0}}
</style>
